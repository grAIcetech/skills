name: beautify skill check

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/beautify/**"
      - "skills/beautify-test/**"
      - "scripts/check-beautify-skill.mjs"
  push:
    branches: [main]
    paths:
      - "skills/beautify/**"
      - "skills/beautify-test/**"
      - "scripts/check-beautify-skill.mjs"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Validate beautify skill structure
        run: npm run check:beautify
